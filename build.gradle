plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    // F4 测试基建：JUnit 5 需要 Maven Central（docs/18-PARALLEL.md §3 F4）
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // P0.2：显式强制 Vulkan 后端（--graphicsBackend 优先于游戏内设置，
            // 见 docs/01-DEV-LOOP.md P0.2：DEFAULT 顺序先试 GL，llvmpipe 可用即被选中，永远轮不到 Vulkan）。
            programArguments.addAll '--graphicsBackend', 'VULKAN'
            // P3.2 相机验证用（可选）：./gradlew runClient -PquickPlay 时追加原版 --quickPlaySingleplayer，
            // 启动后自动进入 run/saves/ 下最近的单人世界 —— 相机矩阵验证必须在世界内做（菜单 level=null）。
            // 不传 -PquickPlay 则行为与原来完全一致（进主菜单）。quickPlay 值可指定存档文件夹名，留空=最近世界。
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 🔬 取证隔离车道（2026-10-04 新增，h27）：gameDirectory = run/h27
        //
        // 🔴 为什么必须有它（不是洁癖，是实测踩到的两个坑）：
        //   ① **配置回写竞态**（`AGENT_CONTEXT.md` §10.32②）：上一个客户端 SIGTERM 后的
        //      关服配置回写会与「kill 后立刻改配置」竞态 ⇒ 改好的值被内存旧值覆盖，
        //      表现为「日志打的是旧值」。h27 又踩了一次：sed 改完读回确认是 false，
        //      启动后日志仍是 true（文件在 17:37:50 被重写回 true）。
        //   ② **并行会话互相覆盖**（h27 实测）：同一仓库若有第二个会话在跑 runClient，
        //      双方共享 run/{config,logs,saves} ⇒ 端口抢占 + 配置互写 + 日志互盖，
        //      两边的取证都不可信（本次 Group B 的客户端就是被另一个会话顶掉的）。
        //   ⇒ 取证必须**独占** game directory。放在 run/ 下 ⇒ 已被 .gitignore 覆盖（第 68 行）。
        //
        // 用法（与主车道完全平行，只是换目录）：
        //   ./gradlew runClientIso -PquickPlay
        //   MCP 驱动需指向本车道的桥配置（端口不同，避免与主车道抢占）：
        //     VKDISP_MCP_CONFIG=run/h27/config/mcpfabric.config.json python3 tools/mcp-drive.py ...
        clientIso {
            client()
            programArguments.addAll '--graphicsBackend', 'VULKAN'
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            gameDirectory = project.file('run/h27')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ============================================================================
// P0.2 守卫：Vulkan loader 预检 + 免 root prefix 接线（env-1，2026-10-05）
//
// 🔴 这里解决的不是「崩溃」，是**静默降级**：
//   runs.client / runs.clientIso 传了 `--graphicsBackend VULKAN`，但 libvulkan.so.1
//   缺失时 Minecraft **不会退出**。它只打两行（实测 run/logs/latest.log:32 / :102）：
//     WARN  NativeLibrariesBootstrap: Failed to load Vulkan loader
//     ERROR Minecraft: Failed to create backend Vulkan
//   然后 `Using graphics backend OpenGL, using drivers: 4.6 …`（同文件 :111）
//   **静默退回 OpenGL/llvmpipe 继续跑满取证帧数**。2026-10-05 09:22 那次裸启动
//   就是这样：M-01 / qd-02 / GAP-003 全部是 OpenGL 产物，直接违反
//   docs/01-DEV-LOOP.md P0.2:357「打印出后端类型且不是 OPENGL」。
//
//   故做两件事：
//   ① 【接线】把 tools/vulkan-local/prefix 接进客户端子进程环境。LWJGL 走
//      dlopen("libvulkan.so.1")，必须在 LD_LIBRARY_PATH 里；**刻意放在配置期**
//      而不是 doFirst —— gradle.properties:6 开了 configuration-cache，
//      在任务动作里改 environment / 启进程都会破坏它。
//   ② 【守卫】客户端两条车道 dependsOn vulkanPreflight（+ 深层探测 vulkanProbe），
//      loader/ICD 就绪与否**硬失败**，不再让证据静默降级。
//
// ⚠️ tools/ 被 .gitignore 忽略（.gitignore:80），别人 clone 的仓库没有 prefix，
//    故整段按 prefix 是否就绪条件接线：prefix 不在就退回「系统 loader 在不在」的判断，
//    两者都没有才失败（报错文案同时给出免 root 与 pacman 两条修法）。
//
// 共享文件：build.gradle 属 docs/18-PARALLEL.md §7.2 的 env-1 独占清单，
// 本次为 env-1 应用户要求的一次性改动（§7.1 的禁令针对并行线，不适用）。
// ============================================================================
def vkPrefixDir = file('tools/vulkan-local/prefix')
def vkLibDir = new File(vkPrefixDir, 'usr/lib')
def vkIcdFile = new File(vkPrefixDir, 'usr/share/vulkan/icd.d/lvp_icd.json')
def vkScript = file('tools/vulkan-local/preflight.sh')
def vkSkipCheck = project.findProperty('vulkanSkipCheck')?.toString()?.toBoolean() ?: false
// —— OS 分流（2026-10-09）：本守卫的判定键全部是 Linux 产物（preflight.sh / /usr/lib/libvulkan.so.1 /
//    本地 prefix 的 libvulkan.so.1），在 Windows 上必然全假 ⇒ 会把 Windows 车道误判成「缺 loader」而中止。
//    Windows 走系统 vulkan-1.dll，故单独分流；⚠️ env-1（Linux）不进该分支，原逻辑一字未改。
def vkIsWindows = System.getProperty('os.name')?.toLowerCase(Locale.ROOT)?.contains('windows') ?: false
// Windows 车道的系统 loader 路径在配置期固化，避免在任务动作里读环境变量（configuration-cache 友好）
def vkWinLoader = vkIsWindows ? new File(System.getenv('SystemRoot') ?: 'C:\\Windows', 'System32/vulkan-1.dll') : null

// —— 配置期判定：不 exec、不在任务动作里引用 project ⇒ configuration-cache 安全
def vkPrefixReady = vkLibDir.isDirectory() && new File(vkLibDir, 'libvulkan.so.1').exists() && vkIcdFile.isFile()
if (vkPrefixReady) {
    def m = (vkIcdFile.text =~ /"library_path"\s*:\s*"([^"]+)"/)
    def icdLib = m.find() ? m.group(1) : ''
    def icdOk = icdLib.startsWith('/') ? new File(icdLib).exists()
            : (!icdLib.isEmpty() && new File(vkLibDir, icdLib).exists())
    if (!icdOk) {
        logger.warn("[vulkan] ICD ${vkIcdFile.name} 指向的库解析不到（${icdLib}）⇒ 不注入 prefix 环境，交由 vulkanPreflight 报错")
        vkPrefixReady = false
    }
}
def vkSystemLoader = ['/usr/lib/libvulkan.so.1', '/lib/libvulkan.so.1', '/usr/lib64/libvulkan.so.1',
                      '/usr/lib/x86_64-linux-gnu/libvulkan.so.1'].find { new File(it).exists() }

// —— ① prefix 接线（配置期；只有就绪时才注入，绝不覆盖别人的环境）
if (vkPrefixReady) {
    def curLdPath = System.getenv('LD_LIBRARY_PATH')
    def vkLdPath = curLdPath ? "${vkLibDir.absolutePath}:${curLdPath}".toString() : vkLibDir.absolutePath
    ['runClient', 'runClientIso'].each { String runTask ->
        tasks.named(runTask).configure { t ->
            t.environment 'LD_LIBRARY_PATH', vkLdPath
            t.environment 'VK_DRIVER_FILES', vkIcdFile.absolutePath
            t.environment 'VK_ICD_FILENAMES', vkIcdFile.absolutePath
            t.logger.lifecycle("[vulkan] prefix 已接线：${vkLibDir.absolutePath} + ICD ${vkIcdFile.name}")
        }
    }
}

// —— ② 深层探测：dlopen loader → vkCreateInstance → 枚举物理设备
//    用 Exec 任务而非任务动作里 exec {}，就是为了不破坏 configuration-cache。
def vulkanProbe = tasks.register('vulkanProbe', Exec) {
    group = 'verification'
    description = '深层探测 Vulkan：等同 bash tools/vulkan-local/preflight.sh'
    onlyIf { !vkSkipCheck && vkScript.isFile() }
    workingDir = projectDir
    commandLine 'bash', vkScript.absolutePath
    if (vkPrefixReady) {
        environment 'LD_LIBRARY_PATH', vkLibDir.absolutePath
        environment 'VK_DRIVER_FILES', vkIcdFile.absolutePath
        environment 'VK_ICD_FILENAMES', vkIcdFile.absolutePath
    }
}

// —— ③ 存在性兜底：prefix 缺失且系统也没有 loader ⇒ 硬失败（而不是让游戏退回 OpenGL）
def vulkanPreflight = tasks.register('vulkanPreflight') {
    group = 'verification'
    description = 'Vulkan 启动前自检：loader / ICD 就绪性硬检查（不启动游戏）'
    // 配置期固化下面四个值：任务动作里只读它们，不碰 project / provider
    def ready = vkPrefixReady
    def sysLoader = vkSystemLoader
    def scriptFile = vkScript
    def skip = vkSkipCheck
    def win = vkIsWindows
    def winLoader = vkWinLoader
    dependsOn vulkanProbe

    doLast {
        if (skip) {
            logger.lifecycle('[vulkan] -PvulkanSkipCheck=true ⇒ 跳过自检（可能静默退回 OpenGL，后果自负）')
            return
        }
        // —— Windows 车道（2026-10-09）：上面的 ready / sysLoader 判定键全是 Linux 路径，
        //    Windows 上恒为假。这里改判系统 loader System32\vulkan-1.dll。
        //    ⚠️ Linux（env-1）绝不到达此分支，其下原有逻辑保持原样。
        if (win) {
            if (winLoader != null && winLoader.isFile()) {
                logger.lifecycle("[vulkan] Windows 车道：系统 loader 就绪 ${winLoader.absolutePath}（Linux prefix 检查不适用，已跳过）")
            } else {
                logger.warn("[vulkan] Windows 车道未找到 ${winLoader?.absolutePath ?: 'System32/vulkan-1.dll'}；若客户端静默退回 OpenGL，请重装显卡驱动或安装 Vulkan Runtime。继续启动。")
            }
            return
        }
        if (ready) {
            logger.lifecycle("[vulkan] loader/ICD 就绪（本地 prefix）：${vkLibDir.absolutePath}")
            return
        }
        if (sysLoader) {
            logger.lifecycle("[vulkan] 使用系统级 loader：${sysLoader}（本地 prefix 未就绪）")
            return
        }
        if (scriptFile.isFile()) {
            logger.lifecycle("[vulkan] 本地 prefix 未就绪；深层探测结果见上方 vulkanProbe")
            return
        }
        throw new GradleException(
                "[vulkan] 找不到 libvulkan.so.1，客户端车道已中止。\n" +
                "  继续启动的后果不是崩溃，而是 Minecraft 静默退回 OpenGL/llvmpipe，\n" +
                "  采到的帧与截图全部不是 Vulkan 证据（违反 docs/01-DEV-LOOP.md P0.2）。\n" +
                "  修法二选一：\n" +
                "    1) 免 root：补齐 tools/vulkan-local/prefix\n" +
                "       （usr/lib/libvulkan.so.1 + usr/lib/libvulkan_lvp.so + usr/share/vulkan/icd.d/lvp_icd.json）\n" +
                "    2) 系统级：sudo pacman -S vulkan-icd-loader vulkan-tools\n" +
                "  临时绕过（明知会退回 OpenGL）：-PvulkanSkipCheck=true")
    }
}

// 客户端两条车道前置自检；server / gameTestServer / data 不需要 Vulkan，不挂
['runClient', 'runClientIso'].each { String runTask ->
    tasks.named(runTask).configure { dependsOn vulkanPreflight }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // F4 测试基建（docs/18-PARALLEL.md §3）：JUnit 5，供并行线用单测自证。
    // 版本用 BOM 对齐；这是 env-1 对共享文件 build.gradle 的一次性改动（§7.2）。
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // P3.1：业务类（shadow/LightSpaceList）与被测管线持 joml 类型，测试源集需要同一 jar 才能编译。
    // 版本 = MC 26.3 运行时自带的 joml（gradle 缓存 org.joml:joml:1.10.9），与主源集来自同一构件。
    testImplementation 'org.joml:joml:1.10.9'
    // A2 差分探针（19 §2.6-A2 / §7-1 裁决允许）：jcpp = Apache-2.0 纯 Java C 预处理器，
    // 只进测试源集（生产路径不引入），用作「现自研 vs jcpp」逐字节 diff 的第二臂。
    // 🔖 用 libs/ 文件依赖：本机 Gradle 全局代理（127.0.0.1:12334）未运行时 Maven Central 不可达，
    //    jar 由 curl --noproxy 手动下载（与 memory 里「jar 只能从 WSL 拷」同一族处置）。
    testImplementation files('libs/jcpp-1.4.14.jar', 'libs/slf4j-api-1.7.12.jar', 'libs/java-semver-0.8.0.jar')
}

// F4：启用 JUnit Platform；测试失败 = build 失败（并行线证据规范 §7.3 要求单测全绿）
tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            // 运行时依赖声明用的范围，与编译期精确版本刻意分开（见 gradle.properties 注释）
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// 分发合规：jar 内必须随带 LICENSE 全文
// 依据 docs/07-CONSTRAINTS.md L10 / P3「分发时 jar 内必须带 LICENSE」，
// 以及 docs/01-DEV-LOOP.md §3.2「[ ] 含 LICENSE（本项目是 MIT，必须随分发）」。
// 仓库根 LICENSE 不会自动进入 jar，必须显式声明为打包输入。
tasks.named('jar', Jar).configure {
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ============================================================================
// configuration-cache 兼容性声明（2026-10-09）
//
// 现象：gradle.properties 开着 org.gradle.configuration-cache=true，直接 `runClient`
//   会因 NeoForge moddev 的 PrepareRun 任务无法被序列化而直接失败：
//     field `__runTypeTemplatesSource__` of task `:prepareClientRun` …
//     Could not resolve all files for configuration ':neoForgeConfigOnly'
//   过去一直靠命令行 `--no-configuration-cache` 绕过。
//
// 做法：把 PrepareRun 系列任务显式声明为「不兼容配置缓存」。Gradle 在任务图里遇到
//   它们时会**只对本次构建**停用配置缓存，其余任务（build / test / datagen）仍照常
//   享用缓存 —— 影响面比全局 org.gradle.configuration-cache=false 小得多。
//
// 影响面：这是对插件既有事实的声明，不改变 Linux（env-1）行为；env-1 也因此无需再
//   手写 `--no-configuration-cache`。二者等价，不产生分叉。
// ⚠️ build.gradle 属 docs/18-PARALLEL.md §7.2 的共享文件，本次为**应用户要求的一次性改动**
//   （§7.1 的禁令针对并行线，不适用；同上方 P0.2 守卫那段先例），已记 CHANGE_LOG 九十七。
// ============================================================================
tasks.configureEach { t ->
    if (t.name.startsWith('prepare') && t.name.endsWith('Run')) {
        t.notCompatibleWithConfigurationCache(
                "NeoForge moddev PrepareRun 无法被配置缓存序列化（__runTypeTemplatesSource__ / neoForgeConfigOnly）")
    }
}
